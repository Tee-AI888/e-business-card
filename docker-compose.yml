services:
  app:
    build: .
    ports:
      - "8503:8503"
    environment:
      PORT: "8503"
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET:-change-this-secret-in-production}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-admin-password}
    volumes:
      - ./database:/app/database
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped
